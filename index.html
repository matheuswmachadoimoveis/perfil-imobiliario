<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Nome | Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 400px; text-align: center; }
    .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #fff; }
    h1 { font-size: 1.2rem; margin-bottom: 5px; }
    p { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; }
    .links-container { display: flex; flex-direction: column; gap: 12px; }
    .link-card { display: block; padding: 14px 20px; background-color: #1e1e1e; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 500; border: 1px solid #333; transition: all 0.3s ease; }
    .link-card:hover { background-color: #fff; color: #000; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <img src="sua-foto.jpg" alt="Sua Foto" class="profile-img">
    <h1>Matheus Machado</h1>
    <p>Corretora de Imóveis de Alto Padrão | Especialista em Luxo</p>

    <div class="links-container">
      <a href="https://wa.me/seunumero" target="_blank" class="link-card">💬 Falar no WhatsApp</a>
      <a href="https://seusite.com.br" target="_blank" class="link-card">🏠 Ver Catálogo de Imóveis</a>
      <a href="mailto:contato@email.com" class="link-card">✉️ Enviar E-mail</a>
    </div>
  </div>
</body>
</html>
